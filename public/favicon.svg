<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="12" fill="url(#grad1)"/>

  <!-- Hospital Building - Simple and Clean -->
  <g fill="#ffffff">
    <!-- Main building -->
    <rect x="18" y="20" width="28" height="32" rx="2"/>

    <!-- Roof -->
    <path d="M 16 22 L 32 12 L 48 22 L 46 22 L 32 14 L 18 22 Z"/>

    <!-- Medical Cross -->
    <rect x="28" y="28" width="8" height="16" rx="1"/>
    <rect x="23" y="33" width="18" height="6" rx="1"/>

    <!-- Windows -->
    <circle cx="24" cy="46" r="1.5" fill="#667eea"/>
    <circle cx="32" cy="46" r="1.5" fill="#667eea"/>
    <circle cx="40" cy="46" r="1.5" fill="#667eea"/>
  </g>
</svg>
